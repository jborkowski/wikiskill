[project]
name = "wikiskill"
version = "0.1.0"
description = "WikiSkill skills + evaluation workspace"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["wikiskill-eval"]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "basedpyright>=1.28",
]

[tool.uv]
package = false
default-groups = ["dev"]
# contrastive-lm declares vllm (CUDA). Workspace root must own exclusions.
exclude-dependencies = [
  { package = { name = "contrastive-lm" }, dependencies = ["vllm"] },
]

[tool.uv.workspace]
members = ["eval"]

[tool.uv.sources]
wikiskill-eval = { workspace = true }
