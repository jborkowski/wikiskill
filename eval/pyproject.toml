[project]
name = "wikiskill-eval"
version = "0.1.0"
description = "Typed skill-run evaluation library (CLM + MLX encoder on Apple Silicon)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "wikiskill" }]
dependencies = [
  "numpy>=1.24",
  "requests>=2.28",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.100",
  "uvicorn[standard]>=0.23",
  "torch>=2.1",
  "mlx>=0.22; sys_platform == 'darwin'",
  "mlx-lm>=0.25; sys_platform == 'darwin'",
  "huggingface-hub>=0.20",
]

[project.optional-dependencies]
# contrastive-lm pins vllm (Linux/CUDA). On macOS:
#   uv pip install contrastive-lm --no-deps
dev = ["ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiskill_eval"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wikiskill_eval"]

[[tool.mypy.overrides]]
module = ["clm", "clm.*", "mlx", "mlx.*", "mlx_lm", "mlx_lm.*"]
ignore_missing_imports = true
