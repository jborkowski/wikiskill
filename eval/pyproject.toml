[project]
name = "wikiskill-eval"
version = "0.1.0"
description = "Typed skill-run evaluation library (CLM + MLX encoder on Apple Silicon)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "wikiskill" }]
dependencies = [
  "numpy>=1.24",
  "requests>=2.28",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "fastapi>=0.100",
  "uvicorn[standard]>=0.23",
  "torch>=2.1",
  "contrastive-lm>=0.1.0",
  "mlx>=0.22; sys_platform == 'darwin'",
  "mlx-lm>=0.25; sys_platform == 'darwin'",
  "huggingface-hub>=0.20",
]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "basedpyright>=1.28",
]

[project.scripts]
eval = "wikiskill_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiskill_eval"]

[tool.uv]
package = true
# vllm exclusion lives on the workspace root (../pyproject.toml).

# --- formatter + linter (Ruff) ------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = [".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # bugbear
  "SIM",   # simplify
  "RUF",   # ruff-specific
  "ANN",   # type annotations
  "ASYNC", # async correctness
  "S",     # bandit (security)
  "T20",   # no print in library paths (allow in mlx server via per-file)
  "PTH",   # pathlib
  "TC",    # type-checking blocks
  "PERF",  # performance
  "N",     # naming
]
ignore = [
  "E501",    # line length handled by formatter
  "ANN401",  # Any is intentional at CLM boundaries
  "S101",    # assert used in Encoder invariants
]

[tool.ruff.lint.per-file-ignores]
"src/wikiskill_eval/mlx_emb/server.py" = ["T20"]
"src/wikiskill_eval/cli.py" = ["T20"]
"src/wikiskill_eval/__main__.py" = ["T20"]
"src/wikiskill_eval/runtime.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["wikiskill_eval"]
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

# --- type checker (basedpyright) ---------------------------------------------

[tool.basedpyright]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
# Third-party ML / CLM have incomplete stubs
reportMissingImports = "warning"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

# Keep mypy config for editors that still use it
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wikiskill_eval"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["clm", "clm.*", "mlx", "mlx.*", "mlx_lm", "mlx_lm.*"]
ignore_missing_imports = true
